<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Live Releases Store</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 600px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .status {
            font-size: 0.85rem;
            color: #58a6ff;
            margin-top: 10px;
        }

        #feed {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease-out;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #8b949e;
        }

        .repo-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #58a6ff;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 5px;
        }

        .repo-name:hover {
            text-decoration: underline;
        }

        .tag {
            display: inline-block;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #f0f6fc;
            font-weight: 600;
            margin-left: 8px;
        }

        .description {
            font-size: 0.9rem;
            color: #8b949e;
            margin: 8px 0;
            line-height: 1.4;
        }

        .footer-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #21262d;
            font-size: 0.8rem;
            color: #8b949e;
        }

        .btn-download {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .btn-download:hover {
            background-color: #2ea44f;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>GitHub Live App Releases</h1>
        <div class="subtitle">Descobrindo projetos e softwares do mundo inteiro no exato segundo em que são lançados, sem filtros de popularidade.</div>
        <div id="status" class="status">Conectando ao fluxo do GitHub...</div>
    </header>

    <main id="feed">
        <!-- Os cards de apps vão aparecer aqui dinamicamente -->
    </main>

    <script>
        const feedContainer = document.getElementById('feed');
        const statusText = document.getElementById('status');
        
        // Guardar IDs para evitar duplicados na tela caso a API repita eventos
        const seenReleases = new Set();

        async function fetchLiveReleases() {
            statusText.innerText = "Buscando novos lançamentos...";
            try {
                // Endpoint público global de eventos do GitHub
                const response = await fetch('https://api.github.com/events', {
                    headers: { 'Accept': 'application/vnd.github+json' }
                });
                
                if (!response.ok) throw new Error('Limite de requisições atingido ou erro na API');

                const events = await response.json();
                
                // Filtra APENAS eventos de "ReleaseEvent" (quando criam uma versão publicada)
                const releaseEvents = events.filter(event => event.type === 'ReleaseEvent');

                if (releaseEvents.length === 0) {
                    statusText.innerText = "Monitorando fluxo ativo... Aguardando novos deploys mundiais.";
                    return;
                }

                statusText.innerText = "Fluxo ao vivo ativo. Atualizando...";

                releaseEvents.forEach(event => {
                    const releaseId = event.payload.release.id;
                    
                    // Se já exibimos esse release, ignora
                    if (seenReleases.has(releaseId)) return;
                    seenReleases.add(releaseId);

                    const repoName = event.repo.name;
                    const tagVersion = event.payload.release.tag_name;
                    const releaseTitle = event.payload.release.name || tagVersion;
                    const repoUrl = `https://github.com/${repoName}`;
                    const downloadUrl = event.payload.release.html_url;
                    
                    // Tratamento simples para repositórios sem descrição externa
                    let description = event.payload.release.body || "Nenhuma nota de lançamento fornecida.";
                    if (description.length > 200) {
                        description = description.substring(0, 200) + '...';
                    }

                    // Limpar tags Markdown/HTML básicas que venham no texto do body do release
                    description = description.replace(/[#*`]/g, '');

                    // Cria o HTML do Card
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <a href="${repoUrl}" target="_blank" class="repo-name">${repoName}</a>
                        <span class="tag">${tagVersion}</span>
                        <div style="font-weight: 500; margin-top:5px; font-size:0.95rem;">${releaseTitle}</div>
                        <p class="description">${description}</p>
                        <div class="footer-card">
                            <span>Publicado por: @${event.actor.login}</span>
                            <a href="${downloadUrl}" target="_blank" class="btn-download">Ver Lançamento</a>
                        </div>
                    `;

                    // Insere sempre no topo para dar o efeito de feed em tempo real
                    feedContainer.insertBefore(card, feedContainer.firstChild);

                    // Limita a tela a 40 itens para não travar o navegador
                    if (feedContainer.children.length > 40) {
                        feedContainer.removeChild(feedContainer.lastChild);
                    }
                });

            } catch (error) {
                console.error(error);
                statusText.innerText = "Aguardando janela de requisições do GitHub (Rate Limit)...";
            }
        }

        // Executa a primeira busca imediatamente ao carregar
        fetchLiveReleases();

        // O GitHub atualiza essa lista de tempos em tempos. 
        // Rodamos a busca a cada 30 segundos (respeitando as regras de uso da API gratuita)
        setInterval(fetchLiveReleases, 30000);
    </script>
</body>
</html>
